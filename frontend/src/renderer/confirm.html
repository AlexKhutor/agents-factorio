<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"/>
<title>Confirmation</title>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="confirm.css"/>
</head>
<body class="confirm-body">
<div class="confirm-card" id="card">
  <div class="confirm-head">
    <span class="brand-mark">A</span>
    <span class="confirm-title" id="title">Confirmation</span>
  </div>
  <div class="confirm-message" id="message"></div>
  <div class="confirm-detail" id="detail"></div>
  <div class="confirm-actions">
    <button id="cancel">Cancel</button>
    <button id="accept" class="primary">Confirm</button>
  </div>
</div>
<script src="confirm.js"></script>
</body>
</html>
